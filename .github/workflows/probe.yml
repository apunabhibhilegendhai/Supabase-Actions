# Temporary registration probe: proves whether GitHub indexes workflow files in
# this repository, and reports why supabase-host.yml is rejected if it is.
# `workflow_dispatch` only — it never runs on its own.
name: Workflow registration probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Detect duplicate mapping keys
        run: |
          python3 - <<'EOF'
          import sys, yaml
          from yaml.loader import SafeLoader

          class DupCheckLoader(SafeLoader):
              pass

          def no_dup(loader, node, deep=False):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping:
                      raise ValueError(
                          f"duplicate key {key!r} at line {key_node.start_mark.line + 1}"
                      )
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping

          DupCheckLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, no_dup
          )

          path = ".github/workflows/supabase-host.yml"
          try:
              yaml.load(open(path, encoding="utf-8"), Loader=DupCheckLoader)
              print("no duplicate keys")
          except Exception as exc:                     # noqa: BLE001
              print(f"DUPLICATE/STRUCTURE ERROR: {exc}")
              sys.exit(1)
          EOF

      - name: actionlint supabase-host.yml
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          ./actionlint .github/workflows/supabase-host.yml && echo "actionlint: clean"
