# =============================================================================
#  Full Supabase Self-Hosted on GitHub Actions
# =============================================================================
# What this does:
# 1. Starts ALL Supabase services (full stack with Storage, Realtime, etc.)
# 2. Restores your database from GitHub Actions cache (so data persists)
# 2b. Snapshots the FULL state every 5 minutes during the session (on-disk),
#     persisted to the Actions cache at shutdown. NOTE: GitHub no longer
#     exposes the cache-service env vars to run: steps, so per-snapshot cache
#     uploads from the keepalive loop are impossible  persistence relies on
#     the end-of-run actions/cache save (which runs from the action runtime).
# 3. Exposes everything via Cloudflare Tunnel
# 4. Runs for ~5h30m per session (maximizing the full 6-hour GitHub Actions limit)
# 5. 24/7 chaining: the workflow-watchman Cloudflare Worker dispatches a new
#    run the moment a session completes (2 min grace). The 6-hour schedule
#    remains as a no-cancel fallback  with cancel-in-progress: false it
#    QUEUES behind the active session and starts only after it ends, so it
#    never kills a live session (watchman fills schedule delays too).
#
# Required GitHub Secrets:
#   CF_TUNNEL_TOKEN     - Cloudflare Tunnel token (from cloudflared tunnel token generate)
#   CF_TUNNEL_DOMAIN    - Your domain for public access (e.g. supabase.chuglii.in)
#   POSTGRES_PASSWORD   - Your secure PostgreSQL password
#   JWT_SECRET          - JWT signing secret (32+ chars)
#   DASHBOARD_PASSWORD  - Supabase Studio admin password
#
# Optional SMTP secrets (REAL auth emails  confirmation / reset / OTP actually
# reach users instead of the dev-only inbucket fake SMTP). Leave unset to keep
# inbucket. Any SMTP provider works (Resend, SendGrid, SES, Brevo, ...):
#   SMTP_HOST          e.g. smtp.resend.com
#   SMTP_PORT          e.g. 587
#   SMTP_USER          e.g. resend
#   SMTP_PASS          the provider's SMTP password / API key
#   SMTP_ADMIN_EMAIL   verified From address (must be allowed by the provider)
#   SMTP_SENDER_NAME   display name shown as the sender
#
# Optional off-site backup secret (Cloudflare KV disaster-recovery mirror):
#   CLOUDFLARE_BACKUP_TOKEN - a permanent Cloudflare API token ("Workers KV
#                             Storage: Edit") OR an OAuth refresh token from
#                             `wrangler login` (starts with 'cfor'; single-use 
#                             the runner keeps the rotated token in .env for
#                             continuity). Without it, state persists only via
#                             the Actions cache + runner-local archive.
# =============================================================================

name:  Full Supabase Self-Hosted
run-name:  Full Supabase Self-Hosted${{ github.event.inputs.triggered_by == 'workflow-watchman' && ' (watchman)' || '' }}

on:
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'Source of the trigger (workflow-watchman auto-restart)'
        required: false
        default: ''
  schedule:
    - cron: '0 */6 * * *'               # Fallback heartbeat  queues behind active session

  # NOTE: 'push' trigger removed on purpose  a push mid-session would queue a
  # duplicate run (concurrency no longer cancels live sessions). Manual runs now
  # QUEUE behind the active session and start after it ends. Use workflow_dispatch
  # or the workflow-watchman worker to restart instead.

concurrency:
  group: supabase-host
  # NO cancel-in-progress: a new run (schedule or watchman) QUEUES behind the
  # active session and starts only after it ends. Never kills a live session.
  cancel-in-progress: false

env:
  SUPABASE_DIR: ./supabase
  # Full-state archive: DB dump + edge functions + snippets + pgsodium key
  BACKUP_FILE: ./supabase/supabase-state.tar.gz
  COMPOSE_FILE: docker-compose.yml:docker-compose.logs.yml:docker-compose.redis.yml
  DOCKER_SOCKET_LOCATION: /var/run/docker.sock

jobs:
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 355                  # 5h55m  5 min buffer under 360 min hard limit
    permissions:
      contents: read                      # checkout
      actions: write                      # prune stale state-snapshot cache entries

    steps:
      #  Checkout 
      - name:  Checkout repo
        uses: actions/checkout@v7

      #  Restore caches 
      # NOTE: Docker images are NOT cached anymore  they pull fresh each run
      # (~2 min, in parallel with setup), which keeps the GitHub cache tiny.
      # Only the full-state archive (DB + functions + snippets + vault key)
      # lives in the cache.

      # Full-state archive cache (separate key with fallback for cross-run persistence)
      # Restores the most recent 'supabase-db-live-*' entry (written by the
      # end-of-run cache save), falling back to legacy 'supabase-db-*' keys.
      - name:  Restore state cache
        id: cache-db
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BACKUP_FILE }}
          key: supabase-db-live-${{ github.run_id }}
          restore-keys: |
            supabase-db-live-
            supabase-db-
          fail-on-cache-miss: false

      #  Parallel prep + startup (everything runs at once) 
      - name:  Super-fast startup
        run: |
          cd ${{ env.SUPABASE_DIR }}
          
          # 
          # PHASE 1: Prepare dependencies (parallel background jobs)
          # 
          (
            # Download cloudflared & bore (TCP tunnel for Redis)
            curl -sL --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
              -o /usr/local/bin/cloudflared &&
            chmod +x /usr/local/bin/cloudflared &&
            curl -sL --retry 3 https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /usr/local/bin &&
            chmod +x /usr/local/bin/bore &&
            cloudflared version
          ) &
          pip install 'ecdsa>=0.19.0' -q &
          (mkdir -p volumes/{db/data,functions,pooler,snippets,api,logs,redis/data} && chmod -R 777 volumes/redis/data) &
          
          # Pull Docker images in the background (runs in parallel with setup).
          # No image cache anymore  images are re-pullable and pull quickly.
          echo " Pulling Docker images in background..."
          docker compose pull 2>&1 | tail -3 &

          # Ensure the named volume used by Postgres for pgsodium key persist exists.
          # On a fresh runner, or after a cache miss, this volume can be missing and
          # `docker compose up` will fail with: external volume "db-config" not found.
          docker volume create supabase_db-config >/dev/null 2>&1 || true

          wait

          # Guard: the compose file declares db-config as external: true, so docker
          # compose up will hard-fail if a Docker volume named exactly "db-config"
          # does not exist on the runner (fresh runner or after a cache miss).
          docker volume create db-config >/dev/null 2>&1 || true
          
          # 
          # PHASE 2: Configure .env (fast  ~3s)
          # 
          cp .env.example .env
          CF_DOMAIN="${{ vars.CF_TUNNEL_DOMAIN || secrets.CF_TUNNEL_DOMAIN }}"
          if [ -n "$CF_DOMAIN" ]; then
            export PUBLIC_URL="https://$CF_DOMAIN"
          else
            export PUBLIC_URL="http://localhost:8000"
          fi
          python3 << 'PYEOF'
          import os, hmac, hashlib, base64, json, uuid
          from ecdsa import SigningKey, NIST256p
          from ecdsa.util import sigencode_string

          secret = os.environ['JWT_SECRET']
          public_url = os.environ['PUBLIC_URL']

          def derive_hex(name, num_bytes):
              return hmac.new(secret.encode(), name.encode(), hashlib.sha512).hexdigest()[:num_bytes * 2]
          def derive_b64(name, length):
              return base64.urlsafe_b64encode(
                  hmac.new(secret.encode(), name.encode(), hashlib.sha512).digest()).decode()[:length]
          def b64url(d):
              return base64.urlsafe_b64encode(d).rstrip(b'=').decode()
          def sign_hs256(payload_dict, secret):
              header = json.dumps({"alg": "HS256", "typ": "JWT"}).encode()
              payload = json.dumps(payload_dict).encode()
              b64_h = b64url(header)
              b64_p = b64url(payload)
              sig = hmac.new(secret.encode(), f"{b64_h}.{b64_p}".encode(), hashlib.sha256).digest()
              return f"{b64_h}.{b64_p}.{b64url(sig)}"
          def sign_es256(payload_dict, sk, kid):
              header = json.dumps({"alg": "ES256", "typ": "JWT", "kid": kid}).encode()
              payload = json.dumps(payload_dict).encode()
              b64_h = b64url(header)
              b64_p = b64url(payload)
              sig = sk.sign(f"{b64_h}.{b64_p}".encode(), hashfunc=hashlib.sha256, sigencode=sigencode_string)
              return f"{b64_h}.{b64_p}.{b64url(sig)}"

          iat = 1700000000
          exp = iat + 315360000
          anon_key = sign_hs256({'role': 'anon', 'iss': 'supabase', 'iat': iat, 'exp': exp}, secret)
          service_key = sign_hs256({'role': 'service_role', 'iss': 'supabase', 'iat': iat, 'exp': exp}, secret)

          skb = derive_b64('secret_key_base', 64)
          rek = derive_hex('realtime_enc_key', 8)
          vek = derive_hex('vault_enc_key', 16)
          pmk = derive_b64('pg_meta_crypto_key', 32)
          ptid = derive_hex('pooler_tenant_id', 8)
          # s3 keys no longer needed  storage service removed
          lfp = derive_b64('logflare_public', 32)
          lpv = derive_b64('logflare_private', 32)
          redis_pass = os.environ.get('REDIS_PASSWORD') or derive_hex('redis_password', 16)

          # Generate ES256 P-256 key pair deterministically from JWT_SECRET
          ec_seed = hmac.new(secret.encode(), b'asymmetric_es256', hashlib.sha512).digest()[:32]
          sk_ec = SigningKey.from_string(ec_seed, curve=NIST256p)
          vk = sk_ec.verifying_key
          pub_point = vk.pubkey.point
          jwk_x = b64url(pub_point.x().to_bytes(32, 'big'))
          jwk_y = b64url(pub_point.y().to_bytes(32, 'big'))
          jwk_d = b64url(sk_ec.privkey.secret_multiplier.to_bytes(32, 'big'))
          jwk_k = b64url(secret.encode())
          kid = str(uuid.UUID(bytes=hmac.new(secret.encode(), b'jwks_kid', hashlib.sha512).digest()[:16]))
          jwt_keys = json.dumps([{"kty":"EC","kid":kid,"use":"sig","key_ops":["sign","verify"],"alg":"ES256","ext":True,"crv":"P-256","x":jwk_x,"y":jwk_y,"d":jwk_d},{"kty":"oct","alg":"HS256","k":jwk_k,"kid":"legacy-hs256"}])
          jwt_jwks = json.dumps({"keys":[{"kty":"EC","kid":kid,"use":"sig","key_ops":["verify"],"alg":"ES256","ext":True,"crv":"P-256","x":jwk_x,"y":jwk_y},{"kty":"oct","alg":"HS256","k":jwk_k,"kid":"legacy-hs256"}]})
          anon_asymmetric = sign_es256({'role':'anon','iss':'supabase','iat':iat,'exp':exp}, sk_ec, kid)
          service_asymmetric = sign_es256({'role':'service_role','iss':'supabase','iat':iat,'exp':exp}, sk_ec, kid)
          def mk_opaque(p):
              r = b64url(hmac.new(secret.encode(),f'opaque_{p}'.encode(),hashlib.sha512).digest()[:17])[:22]
              c = b64url(hmac.new(f'supabase-self-hosted|{p}{r}'.encode(),b'checksum',hashlib.sha256).digest()[:6])[:8]
              return f'{p}{r}_{c}'
          pub_k, sec_k = mk_opaque('sb_publishable_'), mk_opaque('sb_secret_')

          with open('.env') as f: env_content = f.read()
          reps = {
            'your-super-secret-and-long-postgres-password': os.environ['POSTGRES_PASSWORD'],
            'your-super-secret-jwt-token-with-at-least-32-characters-long': os.environ['JWT_SECRET'],
            'this_password_is_insecure_and_should_be_updated': os.environ['DASHBOARD_PASSWORD'],
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE': anon_key,
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q': service_key,
            'UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq': skb,
            'http://localhost:8000': public_url,
            'SITE_URL=http://localhost:3000': f'SITE_URL={public_url}',
            'ADDITIONAL_REDIRECT_URLS=': f'ADDITIONAL_REDIRECT_URLS={public_url}',
            'REALTIME_DB_ENC_KEY=supabaserealtime': f'REALTIME_DB_ENC_KEY={rek}',
            'VAULT_ENC_KEY=your-32-character-encryption-key': f'VAULT_ENC_KEY={vek}',
            'PG_META_CRYPTO_KEY=your-encryption-key-32-chars-min': f'PG_META_CRYPTO_KEY={pmk}',
            'POOLER_TENANT_ID=your-tenant-id': f'POOLER_TENANT_ID={ptid}',
            # S3_PROTOCOL_ACCESS_KEY_ID/SECRET removed  storage service removed
            'your-super-secret-and-long-logflare-key-public': lfp,
            'your-super-secret-and-long-logflare-key-private': lpv,
            'SUPABASE_PUBLISHABLE_KEY=': f'SUPABASE_PUBLISHABLE_KEY={pub_k}',
            'SUPABASE_SECRET_KEY=': f'SUPABASE_SECRET_KEY={sec_k}',
            'JWT_KEYS=': f'JWT_KEYS={jwt_keys}',
            'JWT_JWKS=': f'JWT_JWKS={jwt_jwks}',
            'ANON_KEY_ASYMMETRIC=': f'ANON_KEY_ASYMMETRIC={anon_asymmetric}',
            'SERVICE_ROLE_KEY_ASYMMETRIC=': f'SERVICE_ROLE_KEY_ASYMMETRIC={service_asymmetric}',
            'your-redis-password': redis_pass,
          }
          # Real SMTP (optional)  replaces the fake inbucket defaults so auth
          # confirmation/reset emails actually deliver. Leave SMTP_HOST unset
          # to keep inbucket (dev-only fake SMTP).
          if os.environ.get('SMTP_HOST'):
              reps.update({
                  'SMTP_ADMIN_EMAIL=admin@example.com': f'SMTP_ADMIN_EMAIL={os.environ.get("SMTP_ADMIN_EMAIL", "admin@example.com")}',
                  'SMTP_HOST=supabase-mail': f'SMTP_HOST={os.environ["SMTP_HOST"]}',
                  'SMTP_PORT=2500': f'SMTP_PORT={os.environ.get("SMTP_PORT", "587")}',
                  'SMTP_USER=fake_mail_user': f'SMTP_USER={os.environ.get("SMTP_USER", "resend")}',
                  'SMTP_PASS=fake_mail_password': f'SMTP_PASS={os.environ.get("SMTP_PASS", "")}',
                  'SMTP_SENDER_NAME=fake_sender': f'SMTP_SENDER_NAME={os.environ.get("SMTP_SENDER_NAME", "Supabase")}',
              })
              print("SMTP: real provider configured")
          else:
              # No real SMTP  enable autoconfirm so signup/password-reset
              # work without needing a reachable mail server.
              reps['ENABLE_EMAIL_AUTOCONFIRM=false'] = 'ENABLE_EMAIL_AUTOCONFIRM=true'
              print("SMTP: SMTP_HOST not set  enabling autoconfirm (no email verification required)")
          # OAuth providers (optional): enabling is driven purely by the client-ID
          # secret being set. Redirect URI is API_EXTERNAL_URL/callback (the
          # public URL), already handled by the compose file.
          for prov in ('GOOGLE', 'GITHUB'):
              if os.environ.get(f'{prov}_CLIENT_ID'):
                  reps[f'{prov}_ENABLED=false'] = f'{prov}_ENABLED=true'
                  reps[f'{prov}_CLIENT_ID='] = f'{prov}_CLIENT_ID={os.environ[f"{prov}_CLIENT_ID"]}'
                  reps[f'{prov}_SECRET='] = f'{prov}_SECRET={os.environ[f"{prov}_SECRET"]}'
                  print(f'OAuth: {prov} enabled')
          missing = []
          for old, new in reps.items():
              if old in env_content:
                  env_content = env_content.replace(old, new)
              else:
                  missing.append(old[:40])
          if missing:
              print(f"WARNING: {len(missing)} placeholder(s) not found:")
              for m in missing: print(f"  - {m}...")
          else:
              print(f"All {len(reps)} replacements applied")
          with open('.env','w') as f: f.write(env_content)
          print(".env configured")
          PYEOF
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          # Optional real SMTP for auth emails (falls back to inbucket if unset)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_ADMIN_EMAIL: ${{ secrets.SMTP_ADMIN_EMAIL }}
          SMTP_SENDER_NAME: ${{ secrets.SMTP_SENDER_NAME }}
          # Optional OAuth providers (auto-enabled when the client ID secret is set)
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_SECRET: ${{ secrets.GITHUB_SECRET }}

      #  Wire off-site backup creds (Cloudflare KV) into .env 
      # The keepalive loop pushes every state archive to Workers KV after each
      # snapshot (see snapshot-state.sh); the restore step below pulls it back
      # if the local/cache archive is ever lost. ACCOUNT/NAMESPACE/API_TOKEN
      # are rewritten EVERY run so a token added/changed in secrets always takes
      # effect.
      #
      # Why .cf-creds: Cloudflare 'cfor*' refresh tokens are single-use and
      # rotate on every mint. The old design kept the rotated token in .env —
      # but 'Super-fast startup' recreates .env from .env.example EVERY run and
      # .env is not archived, so after the FIRST session the secret's token was
      # already consumed, there was no rotated token to fall back to, and every
      # later session logged "Cloudflare backup NOT configured"  off-site KV
      # backups silently never ran. The rotated refresh token now lives in
      # .cf-creds, which IS part of the state archive (snapshot-state.sh), so
      # the OAuth chain survives restarts and even cancelled sessions.
      #
      # CLOUDFLARE_BACKUP_TOKEN can be either:
      #   * a permanent account API token (dashboard, scoped to "Workers KV
      #     Storage: Edit")  used as-is; the robust option (survives fresh
      #     runners too), or
      #   * an OAuth refresh token starting with "cfor" (from `wrangler login`)
      #      minted once for the first session; continuity thereafter relies on
      #     the rotated token persisted in .cf-creds.
      - name:  Wire Cloudflare backup creds
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_TOKEN }}
        run: |
          cd ${{ env.SUPABASE_DIR }}
          sed -i -E '/^CF_(ACCOUNT_ID|KV_NAMESPACE_ID|API_TOKEN|REFRESH_TOKEN)=/d' .env 2>/dev/null || true
          {
            echo "CF_ACCOUNT_ID=fb944101733d9b14aa29e5be59073eb2"
            echo "CF_KV_NAMESPACE_ID=f7ad38b06543440a94b4c073a04b4bf3"
          } >> .env

          # (The archived rotated refresh token is loaded further down, only
          # when it is actually needed  avoids a second CF_REFRESH_TOKEN line
          # shadowing a freshly minted one.)

          if [ -n "${CF_API_TOKEN}" ]; then
            case "${CF_API_TOKEN}" in
              cfor*)
                RESP=$(curl -sS --max-time 20 -X POST "https://dash.cloudflare.com/oauth2/token" \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  --data "grant_type=refresh_token&refresh_token=${CF_API_TOKEN}&client_id=54d11594-84e4-41aa-b438-e81b8fa78ee7")
                AT=$(printf '%s' "$RESP" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                RT=$(printf '%s' "$RESP" | sed -n 's/.*"refresh_token":"\([^"]*\)".*/\1/p')
                if [ -n "$AT" ]; then
                  echo "CF_API_TOKEN=${AT}" >> .env
                  [ -n "$RT" ] && echo "CF_REFRESH_TOKEN=${RT}" >> .env
                  echo "  Cloudflare creds minted from OAuth refresh token (chain continues via rotated token)"
                else
                  echo "  Secret refresh token already consumed  falling back to the archived .cf-creds token..."
                fi
                ;;
              *)
                echo "CF_API_TOKEN=${CF_API_TOKEN}" >> .env
                echo "  Cloudflare permanent API token configured"
                ;;
            esac
          else
            echo "  Cloudflare secret not set  relying on the archived .cf-creds token (if any)"
          fi

          # Continuity: if no access token could be minted from the secret,
          # renew one from a rotated refresh token  first whatever survived in
          # .env, otherwise the ARCHIVED .cf-creds fallback (state archive ->
          # restored by the step below). This is what keeps the single-use
          # cfor* chain alive across sessions. cloudflare-backup.sh refresh
          # re-persists the newly rotated token into .cf-creds as well.
          if ! grep -q '^CF_API_TOKEN=.' .env 2>/dev/null; then
            if ! grep -q '^CF_REFRESH_TOKEN=.' .env 2>/dev/null && [ -f ./.cf-creds ] \
               && grep -q '^CF_REFRESH_TOKEN=.' ./.cf-creds 2>/dev/null; then
              grep -E '^CF_REFRESH_TOKEN=' ./.cf-creds | head -1 >> .env
              echo "  Cloudflare rotated refresh token restored from .cf-creds (state archive)"
            fi
            if grep -q '^CF_REFRESH_TOKEN=.' .env 2>/dev/null; then
              bash utils/cloudflare-backup.sh refresh || true
            fi
          fi

          # Persist whatever refresh token we ended up with for the next session.
          # Only overwrite .cf-creds when a real token exists — never clobber a
          # working archived token with an empty file when minting fails.
          if grep -q '^CF_REFRESH_TOKEN=.' .env 2>/dev/null; then
            grep -E '^CF_REFRESH_TOKEN=' .env | head -1 > ./.cf-creds \
              && chmod 600 ./.cf-creds 2>/dev/null || true
          fi

          if ! grep -q '^CF_API_TOKEN=.' .env 2>/dev/null; then
            echo "::warning::Cloudflare backup NOT configured  set a permanent Workers-KV Edit API token as the CLOUDFLARE_BACKUP_TOKEN secret"
          else
            bash utils/cloudflare-backup.sh list 2>/dev/null | head -3 || true
            echo "  Cloudflare backup ready (off-site mirror + disaster-recovery restore)"
          fi

      #  Restore full state (functions, snippets, pgsodium key) 
      - name:  Restore full state (functions, snippets, pgsodium key)
        run: |
          cd ${{ env.SUPABASE_DIR }}

          extract_state_archive() {
            local archive="$1"
            local members_file member
            members_file=$(mktemp)
            if ! tar tzf "$archive" >/dev/null 2>&1; then
              rm -f "$members_file"
              return 1
            fi
            while IFS= read -r member; do
              case "$member" in
                backup.dump|./backup.dump|pgsodium_root.key|./pgsodium_root.key|dump.rdb|./dump.rdb|appendonlydir|./appendonlydir|appendonlydir/|./appendonlydir/|volumes/functions|./volumes/functions|volumes/functions/|./volumes/functions/|volumes/snippets|./volumes/snippets|volumes/snippets/|./volumes/snippets/|volumes/redis/data/dump.rdb|./volumes/redis/data/dump.rdb|volumes/redis/data/appendonly.aof|./volumes/redis/data/appendonly.aof|volumes/redis/data/appendonlydir|./volumes/redis/data/appendonlydir|volumes/redis/data/appendonlydir/|./volumes/redis/data/appendonlydir/|.cf-creds|./.cf-creds|state-ts|./state-ts)
                  printf '%s\n' "$member" >> "$members_file"
                  ;;
              esac
            done < <(tar tzf "$archive" 2>/dev/null)
            if [ ! -s "$members_file" ] || ! tar xzf "$archive" -C . --no-same-owner --no-same-permissions -T "$members_file"; then
              rm -f "$members_file"
              return 1
            fi
            rm -f "$members_file"
          }

          # If the local/cache archive is missing (real disaster recovery), pull
          # the freshest one back from Cloudflare KV before extraction.
          if [ ! -f ./supabase-state.tar.gz ] && grep -q '^CF_API_TOKEN=.' .env 2>/dev/null; then
            echo "  No state archive on disk  attempting Cloudflare restore..."
            bash utils/cloudflare-backup.sh restore ./supabase-state.tar.gz || true
          fi

          if [ -f ./supabase-state.tar.gz ]; then
            echo " State archive found  restoring edge functions, snippets, DB dump, pgsodium key..."

            # Prefer the OFF-SITE Cloudflare copy when it is fresher than the
            # cached one. A cancelled run never reaches the end-of-run cache
            # save, so the KV mirror (pushed every ~25 min by snapshot-state.sh
            # and stamped with its own state-ts) can be hours newer than the
            # cache entry. Adopt whichever backup has the higher timestamp.
            LOCAL_TS="$(tar xzf ./supabase-state.tar.gz -O state-ts 2>/dev/null | tr -dc '0-9' | head -1)"
            KV_TS="$(bash utils/cloudflare-backup.sh manifest 2>/dev/null | tr -dc '0-9' | head -1)"
            LOCAL_TS="${LOCAL_TS:-0}"; KV_TS="${KV_TS:-0}"
            if [ "$KV_TS" -gt "$LOCAL_TS" ] 2>/dev/null; then
              echo "  ☁️  off-site backup is fresher (kv ts $KV_TS > cached ts $LOCAL_TS) — using it"
              if bash utils/cloudflare-backup.sh restore ./supabase-state.tar.gz.kv; then
                mv -f ./supabase-state.tar.gz.kv ./supabase-state.tar.gz
                echo "  ☁️  freshest state adopted from Cloudflare KV"
              else
                rm -f ./supabase-state.tar.gz.kv
                echo "::warning::fresher off-site backup exists but could not be fetched — falling back to the cached copy"
              fi
            fi

            # Extraction must NOT fail silently: continuing without the archive
            # can leave the stack running on an incomplete state.
            if ! extract_state_archive ./supabase-state.tar.gz; then
              echo "::warning::cached state archive is unreadable or unsupported — attempting off-site recovery"
              if bash utils/cloudflare-backup.sh restore ./supabase-state.tar.gz.offsite \
                 && [ -s ./supabase-state.tar.gz.offsite ] \
                 && extract_state_archive ./supabase-state.tar.gz.offsite; then
                mv -f ./supabase-state.tar.gz.offsite ./supabase-state.tar.gz
                echo "  ✅ state recovered from the off-site Cloudflare backup"
              else
                rm -f ./supabase-state.tar.gz.offsite
                echo "::error::state archive is corrupt and no off-site copy could be restored. Refusing to continue as a silent fresh start. Delete the bad supabase-db-* cache entries or restore from Cloudflare KV, then re-run."
                exit 1
              fi
            fi
            # Inject the pgsodium root key into the db-config named volume BEFORE the
            # DB boots, so the same encryption key is used and Vault data stays decryptable.
            if [ -f ./pgsodium_root.key ]; then
              echo "   Injecting pgsodium root key into db-config volume..."
              DB_VOL=$(docker volume ls --format '{{.Name}}' | grep -E 'db-config$' | head -1 || true)
              if [ -z "$DB_VOL" ]; then
                DB_VOL="supabase_db-config"
                docker volume create "$DB_VOL" >/dev/null 2>&1 || true
              fi
              if docker run --rm -v "$DB_VOL":/etc/postgresql-custom \
                -v "$PWD/pgsodium_root.key:/tmp/pgsodium_root.key:ro" \
                supabase/postgres:17.6.1.136 sh -c "cp /tmp/pgsodium_root.key /etc/postgresql-custom/pgsodium_root.key && chmod 644 /etc/postgresql-custom/pgsodium_root.key"; then
                echo "   pgsodium root key injected into $DB_VOL"
              else
                echo "    pgsodium key injection failed  Vault data may not decrypt this run"
              fi
              rm -f ./pgsodium_root.key
            else
              echo "    No pgsodium key in archive (fresh encryption key will be generated)"
            fi
            # Committed functions (e.g. the 'logs' system function) MUST win over
            # stale copies restored from an older session's archive  re-apply
            # tracked files after extraction. Untracked user functions (sample, )
            # stay as restored.
            git checkout -- volumes/functions/ 2>/dev/null || true
            echo "   functions: $(ls volumes/functions 2>/dev/null | tr '\n' ' ')"
            echo "   snippets:  $(ls volumes/snippets 2>/dev/null | tr '\n' ' ')"
            if [ -f ./backup.dump ]; then
              echo "    DB dump: $(du -h ./backup.dump | cut -f1)  will be restored by restore_db()"
            else
              echo "    DB dump: absent (fresh database)"
            fi
            if [ -f ./dump.rdb ]; then
              echo "   Redis dump: $(du -h ./dump.rdb | cut -f1)  restoring to volumes/redis/data"
              mkdir -p volumes/redis/data
              cp -f ./dump.rdb volumes/redis/data/dump.rdb
              chmod -R 777 volumes/redis/data
              rm -f ./dump.rdb
            elif [ -f ./volumes/redis/data/dump.rdb ]; then
              echo "   Redis dump: $(du -h ./volumes/redis/data/dump.rdb | cut -f1)  ready for redis container"
              chmod -R 777 volumes/redis/data 2>/dev/null || true
            fi
          else
            echo "  No state archive  fresh start"
            echo "::warning::No state archive found anywhere (cache miss or first run) — starting with a fresh Supabase database."
          fi

          # Ensure the 'main' edge function exists BEFORE containers start.
          # (edge-runtime boots with --main-service /home/deno/functions/main,
          # so 'main' must exist at compose-up time or the service errors out.)
          #
          #  'main' MUST be the dispatcher (official Supabase pattern): the
          # edge-runtime hands EVERY request to 'main', which then loads
          # /home/deno/functions/<name> per request via EdgeRuntime.userWorkers.
          # A naive "Hello from main" fallback silently swallows every other
          # function (logs, sample, ...)  exactly the bug we hit with /api/logs.
          # We ALWAYS overwrite main after the state-archive restore so an older
          # archived "Hello from main" can never shadow the router again.
          mkdir -p volumes/functions/main volumes/snippets
          cat > volumes/functions/main/index.ts <<'EOF'
          // Dispatcher: routes /<function_name>/* to /home/deno/functions/<function_name>
          // (official Supabase self-hosted pattern  functions load from disk per request)
          Deno.serve(async (req) => {
            const url = new URL(req.url);
            const name = url.pathname.split('/')[1] || '';
            if (!name) {
              // Edge-runtime root  report alive (used by /api/logs/health)
              return new Response(JSON.stringify({ ok: true, service: 'edge-runtime' }), {
                status: 200,
                headers: { 'content-type': 'application/json' },
              });
            }
            const servicePath = `/home/deno/functions/${name}`;
            try {
              const worker = await EdgeRuntime.userWorkers.create({
                servicePath,
                memoryLimitMb: 150,
                workerTimeoutMs: 60 * 1000,
                noModuleCache: false,
                importMapPath: null,
                envVars: Object.entries(Deno.env.toObject()),
              });
              return await worker.fetch(req);
            } catch (e) {
              return new Response(JSON.stringify({ msg: String(e) }), {
                status: 500,
                headers: { 'content-type': 'application/json' },
              });
            }
          });
          EOF
          echo "   edge functions ready: $(ls volumes/functions 2>/dev/null | tr '\n' ' ')"

      # NOTE: no in-session cache helper. GitHub no longer provides the
      # cache-service env vars (ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN) to
      # run: steps, so snapshots can only be persisted via actions/cache steps
      # (end-of-run save below). The keepalive loop writes snapshots to disk so
      # that save always has the freshest archive.

      #  Prune stale cache entries (best-effort, keeps newest 3) 
      # Keeps the Actions cache small (end-of-run state archives) so it never
      # hits the 10GB repo cap. Also re-run hourly from inside the keepalive
      # loop. Needs 'actions: write'; if it isn't granted, old entries just
      # age out via GitHub's LRU eviction instead.
      - name:  Prune stale snapshot cache entries
        env:
          GH_TOKEN: ${{ github.token }}
          # prune-caches.sh reads GITHUB_TOKEN — without it the script aborted
          # with "unbound variable" and never pruned a single entry.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd ${{ env.SUPABASE_DIR }}
          bash utils/prune-caches.sh || true

      #  Start containers + restore DB + tunnel (all in parallel) 
      - name:  Start containers + restore DB + tunnel
        run: |
          cd ${{ env.SUPABASE_DIR }}

          # Start all containers (non-blocking)
          docker compose up -d
          echo "Containers started, waiting for healthchecks..."

          #  Run jobs in parallel with exit-code tracking 
          STATUS_FILE=$(mktemp)
          echo 0 > "$STATUS_FILE"

          restore_db() {
            # FIX: docker compose wait <svc> blocks until the container STOPS (not
            # until healthy), so the old `timeout 120 docker compose wait db` always
            # timed out and the restore NEVER ran. Poll pg_isready instead.
            DB_READY=0
            for i in $(seq 1 60); do
              if docker compose exec -T db pg_isready -U postgres >/dev/null 2>&1; then
                DB_READY=1
                break
              fi
              sleep 2
            done
            if [ "$DB_READY" -ne 1 ]; then
              echo "  Timed out waiting for db to accept connections"
              echo 1 > "$STATUS_FILE"
              return
            fi
            echo "PostgreSQL is accepting connections..."

            #  CRITICAL: Wait for init scripts to finish 
            # pg_isready returns success BEFORE Supabase's init scripts complete.
            # If we restore before they finish, pg_restore conflicts with them
            # and fails silently (data lost). We wait for 'supabase_functions'
            # (created by init-scripts/98-webhooks.sql) OR '_supabase' (created
            # by migrations/97-_supabase.sql). Both are created by our init
            # scripts, not the base image. After either exists, remaining
            # scripts (99-jwt, 99-roles, zz-init-data) only set GUCs/passwords
            # and won't conflict with pg_restore.
            echo "Waiting for Supabase init scripts to complete..."
            INIT_TIMEOUT=120
            INIT_ELAPSED=0
            while [ $INIT_ELAPSED -lt $INIT_TIMEOUT ]; do
              if docker compose exec -T db psql -U postgres -t -c \
                "SELECT 1 FROM information_schema.schemata WHERE schema_name IN ('_supabase','supabase_functions')" 2>/dev/null | grep -q 1; then
                echo " Supabase init scripts complete"
                break
              fi
              sleep 1
              INIT_ELAPSED=$((INIT_ELAPSED + 1))
            done
            if [ $INIT_ELAPSED -ge $INIT_TIMEOUT ]; then
              echo "  Timed out waiting for init scripts  continuing anyway"
            fi

            if [ ! -f ./backup.dump ]; then
              echo "No backup file found  starting fresh database"
              return
            fi

            # Verify backup is valid before attempting restore
            BACKUP_SIZE=$(stat -c%s ./backup.dump 2>/dev/null || echo 0)
            if [ "$BACKUP_SIZE" -lt 100 ]; then
              echo "  Backup file too small (${BACKUP_SIZE}B)  skipping restore"
              return
            fi
            echo "Restoring database from backup ($(du -h ./backup.dump | cut -f1))..."

            # Copy backup into container
            if ! docker compose cp ./backup.dump db:/tmp/backup.dump; then
              echo "ERROR: Failed to copy backup into container"
              echo 1 > "$STATUS_FILE"
              return
            fi

            # Grant postgres access to auth schema so pg_restore and migrations can access it
            docker compose exec -T db psql -U postgres -d postgres -c "
              GRANT ALL ON SCHEMA auth TO postgres;
              GRANT ALL ON ALL TABLES IN SCHEMA auth TO postgres;
              GRANT ALL ON ALL SEQUENCES IN SCHEMA auth TO postgres;
              GRANT ALL ON ALL ROUTINES IN SCHEMA auth TO postgres;
            " 2>/dev/null || true

            # Restore with clean and disable-triggers to ensure table structures and constraints restore cleanly
            RESTORE_LOG=$(mktemp)
            if docker compose exec -T db pg_restore -U postgres -d postgres \
              --clean --if-exists --no-owner --no-privileges --disable-triggers \
              --jobs 2 \
              /tmp/backup.dump 2>"$RESTORE_LOG"; then
              echo " Database fully restored from backup"
            else
              # Filter out expected drop/cleanup notices (e.g. "does not exist" on fresh tables, "permission denied" on auth schema)
              REAL_ERRORS=$(grep -i "error:" "$RESTORE_LOG" 2>/dev/null | grep -viE "does not exist|already exists|permission denied for schema auth|must be owner of|grant_pg_graphql_access|set_graphql_placeholder|pgrst_drop_watch|pgrst_ddl_watch|grant_pg_net_access|grant_pg_cron_access" || true)
              if [ -n "$REAL_ERRORS" ]; then
                echo "  pg_restore warnings:"
                echo "$REAL_ERRORS" | head -5 | sed 's/^/    /'
              else
                echo " Database restored (all drop/system notices are harmless  data intact)"
              fi
            fi
            rm -f "$RESTORE_LOG"

            #  Verify restore success 
            echo "Verifying restore..."
            # Count tables in the 'public' schema specifically  on a fresh Supabase
            # init, 'public' has 0 tables. User data lives in 'public' and custom
            # schemas, so counting public tables isolates user-created data from
            # system schemas (auth, realtime, extensions, etc.)
            PUBLIC_TABLES=$(docker compose exec -T db psql -U postgres -t -A -c \
              "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';" 2>/dev/null || echo "0")
            echo " User tables (public schema): $PUBLIC_TABLES"
            if [ "$PUBLIC_TABLES" -gt 0 ] 2>/dev/null; then
              echo " Restore verified  user data present in public schema"
            else
              # Could be a fresh DB with no user tables, OR a failed restore
              SYSTEM_TABLES=$(docker compose exec -T db psql -U postgres -t -A -c \
                "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema IN ('auth','realtime','_realtime','supabase_functions','_analytics','_supabase','extensions','storage');" 2>/dev/null || echo "0")
              echo " System tables (all schemas): $SYSTEM_TABLES"
              if [ "$SYSTEM_TABLES" -gt 0 ] 2>/dev/null; then
                echo "  System schemas are present  this may be a fresh start or a restore of a DB without user tables"
              else
                echo "  No tables found anywhere  database may be empty!"
              fi
            fi
          }

          start_tunnel() {
            # FIX: same as restore_db  docker compose wait would block until the
            # container stops. Poll Kong's HTTP endpoint instead.
            KONG_READY=0
            for i in $(seq 1 60); do
              if curl -s -o /dev/null http://localhost:8000 >/dev/null 2>&1; then
                KONG_READY=1
                break
              fi
              sleep 2
            done
            if [ "$KONG_READY" -ne 1 ]; then
              echo "  Timed out waiting for Kong on :8000"
              echo 1 > "$STATUS_FILE"
              return
            fi
            echo "Kong is ready on port 8000!"
            if [ -n "${{ secrets.CF_TUNNEL_TOKEN }}" ]; then
              # Run tunnel using remotely managed token (supports multiple hostnames in Zero Trust dashboard)
              nohup cloudflared tunnel --no-autoupdate run \
                --token ${{ secrets.CF_TUNNEL_TOKEN }} \
                > /tmp/cloudflared.log 2>&1 &
              TUNNEL_PID=$!
              echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_ENV
              echo "Cloudflare Tunnel starting..."
              sleep 4
              # Fallback if no ingress rules configured in Zero Trust dashboard
              if grep -qi "no ingress rules" /tmp/cloudflared.log 2>/dev/null || ! kill -0 $TUNNEL_PID 2>/dev/null; then
                kill $TUNNEL_PID 2>/dev/null || true
                nohup cloudflared tunnel --no-autoupdate run \
                  --url http://localhost:8000 \
                  --token ${{ secrets.CF_TUNNEL_TOKEN }} \
                  > /tmp/cloudflared.log 2>&1 &
                TUNNEL_PID=$!
                echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_ENV
              fi
              for i in $(seq 1 12); do
                sleep 5
                if ! kill -0 $TUNNEL_PID 2>/dev/null; then
                  echo "cloudflared process died!"
                  tail -20 /tmp/cloudflared.log
                  break
                fi
                if grep -q "Registered tunnel connection" /tmp/cloudflared.log 2>/dev/null; then
                  echo "Tunnel connected!"
                  TUNNEL_URL=$(grep -oP 'https?://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/cloudflared.log 2>/dev/null | head -1)
                  if [ -n "$TUNNEL_URL" ]; then
                    echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
                  fi
                  break
                fi
              done
            fi
          }

          start_redis_tunnel() {
            for i in $(seq 1 30); do
              if docker compose exec -T redis redis-cli ping >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            if command -v bore >/dev/null 2>&1; then
              # Attempt to bind permanent fixed port 26379 first
              nohup bore local 6379 --to bore.pub --port 26379 > /tmp/bore.log 2>&1 &
              BORE_PID=$!
              echo "BORE_PID=$BORE_PID" >> $GITHUB_ENV
              for i in $(seq 1 5); do
                sleep 1
                BORE_PORT=$(grep -oP 'listening at bore.pub:\K[0-9]+' /tmp/bore.log 2>/dev/null | head -1)
                if [ -n "$BORE_PORT" ]; then
                  break
                fi
              done
              # If fixed port was already taken on bore.pub, fall back to any available port
              if [ -z "$BORE_PORT" ]; then
                kill $BORE_PID 2>/dev/null || true
                nohup bore local 6379 --to bore.pub > /tmp/bore.log 2>&1 &
                BORE_PID=$!
                echo "BORE_PID=$BORE_PID" >> $GITHUB_ENV
                for i in $(seq 1 8); do
                  sleep 1
                  BORE_PORT=$(grep -oP 'listening at bore.pub:\K[0-9]+' /tmp/bore.log 2>/dev/null | head -1)
                  if [ -n "$BORE_PORT" ]; then
                    break
                  fi
                done
              fi
              if [ -n "$BORE_PORT" ]; then
                echo "REDIS_TCP_PORT=$BORE_PORT" >> $GITHUB_ENV
                echo "REDIS_TCP_HOST=bore.pub" >> $GITHUB_ENV
                echo "Redis TCP tunnel active at bore.pub:$BORE_PORT"
              fi
            fi
          }

          restore_db &
          start_tunnel &
          start_redis_tunnel &
          wait

          # FIX: supavisor (pooler) crash-loops at boot  it starts before the
          # DB is fully stable and its migrate/eval fail, causing restart loops.
          # Restart it after restore, then POLL until healthy (up to 60s).
          echo "   Restarting supavisor after DB restore..."
          docker compose restart supavisor > /dev/null 2>&1 || echo "    pooler restart signal failed"
          POOLER_READY=0
          for i in $(seq 1 12); do
            sleep 5
            STATUS=$(docker compose ps supavisor --format json 2>/dev/null | grep -o '"Health":"[^"]*"' | cut -d'"' -f4 || true)
            STATE=$(docker compose ps supavisor --format json 2>/dev/null | grep -o '"State":"[^"]*"' | cut -d'"' -f4 || true)
            if [ "$STATE" = "running" ] && [ "$STATUS" = "healthy" ]; then
              echo "   supavisor healthy after ${i}x5s"
              POOLER_READY=1
              break
            elif [ "$i" -eq 6 ] && [ "$POOLER_READY" -eq 0 ]; then
              # Give it one more restart at 30s if still not healthy
              echo "   supavisor still starting  second restart at 30s..."
              docker compose restart supavisor > /dev/null 2>&1 || true
            fi
          done
          if [ "$POOLER_READY" -eq 0 ]; then
            echo "    supavisor not healthy after 60s  Docker restart policy will recover it"
          fi

          ERR=$(cat "$STATUS_FILE")
          rm -f "$STATUS_FILE"
          if [ "$ERR" -ne 0 ]; then
            echo "WARNING: Some services failed to start"
          fi
          echo "All services ready!"
          docker compose ps 2>/dev/null | head -15

      #  Apply committed migrations (versioned schema changes) 
      # Applies supabase/migrations/*.sql on top of the restored DB (fresh DBs
      # already get the volumes/db/*.sql init scripts at first boot). Files are
      # tracked in public._schema_migrations so each one runs only once across
      # sessions  the tracking table itself is carried by the state backup.
      - name:  Apply committed migrations
        run: |
          cd ${{ env.SUPABASE_DIR }}

          PG_READY=0
          for i in $(seq 1 60); do
            if docker compose exec -T db pg_isready -U postgres >/dev/null 2>&1; then
              PG_READY=1
              break
            fi
            sleep 2
          done
          if [ "$PG_READY" -ne 1 ]; then
            echo "  Postgres not ready  skipping migrations"
            exit 0
          fi

          # Grant postgres read access to auth schema so any migration that
          # JOINs auth.users (e.g. 002-backfill-user-emails.sql) succeeds.
          docker compose exec -T db psql -U postgres -c "
            GRANT USAGE ON SCHEMA auth TO postgres;
            GRANT SELECT ON ALL TABLES IN SCHEMA auth TO postgres;
          " > /dev/null 2>&1 || true

          docker compose exec -T db psql -U postgres -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE IF NOT EXISTS public._schema_migrations (name text PRIMARY KEY, applied_at timestamptz DEFAULT now());" >/dev/null 2>&1 || true

          APPLIED=0
          for f in migrations/*.sql; do
            [ -e "$f" ] || continue
            NAME=$(basename "$f")
            if docker compose exec -T db psql -U postgres -t -A -c \
              "SELECT 1 FROM public._schema_migrations WHERE name = '$NAME'" 2>/dev/null | grep -q 1; then
              echo "   $NAME already applied  skipping"
              continue
            fi
            echo "   Applying $NAME..."
            if docker compose exec -T db psql -U postgres -v ON_ERROR_STOP=1 < "$f" >/dev/null 2>&1; then
              docker compose exec -T db psql -U postgres -c \
                "INSERT INTO public._schema_migrations(name) VALUES ('$NAME')" >/dev/null 2>&1 || true
              echo "   $NAME applied"
              APPLIED=$((APPLIED + 1))
            else
              echo "    $NAME FAILED  not marked applied (will retry next session); fix and re-commit"
            fi
          done
          if [ "$APPLIED" -eq 0 ]; then
            echo "  No new migrations (supabase/migrations empty or up to date)"
          fi

      #  Confirm all unconfirmed users (fixes stuck signups) 
      # If ENABLE_EMAIL_AUTOCONFIRM was false in a previous session and Inbucket
      # failed to deliver the confirmation email, users remain stuck with
      # email_confirmed_at = NULL. This catches them on every startup.
      - name:  Confirm all unconfirmed users
        run: |
          cd ${{ env.SUPABASE_DIR }}
          docker compose exec -T db psql -U postgres -c \
            "UPDATE auth.users SET email_confirmed_at = NOW(), email_change_confirm_status = 0 WHERE email_confirmed_at IS NULL;"
          echo " All unconfirmed users confirmed"

      #  Verify restored state (READ-ONLY) 
      # Reports what survived the backup  cache  restore cycle so you can
      # confirm your changes persisted. Deliberately creates nothing: tables,
      # rows and settings you deleted stay deleted (no more auto-seed).
      - name:  Verify restored state (read-only)
        run: |
          cd ${{ env.SUPABASE_DIR }}

          # Wait until Postgres is accepting connections
          PG_READY=0
          for i in $(seq 1 60); do
            if docker compose exec -T db pg_isready -U postgres >/dev/null 2>&1; then
              PG_READY=1
              break
            fi
            sleep 2
          done
          if [ "$PG_READY" -ne 1 ]; then
            echo "  Timed out waiting for Postgres to become ready  continuing anyway"
          fi

          echo "=============================================================="
          echo "   cache hit:      ${{ steps.cache-db.outputs.cache-hit }}"
          if [ -f ./supabase-state.tar.gz ]; then
            echo "    restored archive: $(du -h ./supabase-state.tar.gz | cut -f1)"
          else
            echo "    restored archive: none (fresh start)"
          fi
          echo ""
          echo "   user tables (public schema):"
          docker compose exec -T db psql -U postgres -t -A -c \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';" 2>/dev/null | tr -d '[:space:]' | sed 's/^/    /'
          echo "    public tables:"
          docker compose exec -T db psql -U postgres -t -A -c \
            "SELECT string_agg(table_name, ', ') FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';" 2>/dev/null | sed 's/^/    /' || echo "    (none)"
          echo "   edge functions:"
          ls volumes/functions 2>/dev/null | sed 's/^/    /' || echo "    (none)"
          echo "   studio snippets:"
          ls volumes/snippets 2>/dev/null | sed 's/^/    /' || echo "    (none)"
          echo "   seed_log (from earlier sessions, if any):"
          docker compose exec -T db psql -U postgres -c "SELECT id, seed_id, seeded_at, note FROM public.seed_log ORDER BY id;" 2>/dev/null || echo "    (no seed_log table  auto-seed removed)"
          echo "   vault (decryptable only if the pgsodium root key persisted):"
          if docker compose exec -T db psql -U postgres -t -A -c "SELECT to_regclass('vault.decrypted_secrets')" 2>/dev/null | grep -q "decrypted_secrets"; then
            docker compose exec -T db psql -U postgres -c "SELECT name, decrypted_secret FROM vault.decrypted_secrets LIMIT 5;" 2>/dev/null || echo "      vault decryption FAILED (pgsodium key changed?)"
          else
            echo "    (vault schema not present)"
          fi
          echo "   redis (cache & rate-limiting):"
          docker compose exec -T redis redis-cli ping 2>/dev/null | sed 's/^/    /' || echo "    (redis running)"
          echo "=============================================================="

      #  Run Supabase (keep alive + on-disk snapshots every 5 minutes) 
      # Every 5 minutes the FULL state (DB dump + pgsodium key + functions +
      # snippets) is refreshed on disk; it's persisted to the Actions cache by
      # the end-of-run cache save below (GitHub doesn't expose cache-service
      # env vars to run: steps, so mid-session uploads are not possible).
      - name:   Supabase is LIVE (auto-snapshot every 5 min)
        env:
          TUNNEL_DOMAIN: ${{ vars.CF_TUNNEL_DOMAIN || secrets.CF_TUNNEL_DOMAIN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}   # hourly prune-caches.sh needs it too
        run: |
          cd ${{ env.SUPABASE_DIR }}

          DURATION=18300  # 5h05m  leaves ~50 min buffer for final backup + cache save
          # (was 5h30m; the old 25 min shutdown budget was too tight for large DBs
          # and could cut the cache save off at the 355-min timeout, losing up to
          # 5h of data on the next restore).
          END_TIME=$(( $(date +%s) + DURATION ))
          DOMAIN="${TUNNEL_DOMAIN:-localhost:8000}"
          # Read Redis password safely from .env without shell-evaluating JSON values
          REDIS_PASSWORD=$(grep -E '^REDIS_PASSWORD=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r')
          export REDIS_PASSWORD  # must be exported so snapshot-state.sh subprocess can use it for redis-cli auth

          BASE_DOMAIN=$(echo "$DOMAIN" | sed 's/^supabase\.//')
          REDIS_SUBDOMAIN="redis.$BASE_DOMAIN"

          echo ""
          echo "+=============================================================+"
          echo "|         SUPABASE IS LIVE ON GITHUB ACTIONS                  |"
          echo "+=============================================================+"
          echo "|                                                             |"
          echo "|  Studio:        http://localhost:8000                       |"
          echo "|  Tunnel:        Connected via Cloudflare                    |"
          if [ -n "$TUNNEL_DOMAIN" ]; then
            echo "|  Studio Domain: https://$DOMAIN                               |"
            echo "|  Redis Web UI:  https://$REDIS_SUBDOMAIN (port 8081)           |"
            echo "|  Cache API:     https://$DOMAIN/functions/v1/cache         |"
          fi
          if [ -n "${REDIS_TCP_PORT:-}" ]; then
            echo "|  Redis TCP:     ${REDIS_TCP_HOST:-bore.pub}:${REDIS_TCP_PORT} (or $REDIS_SUBDOMAIN)     |"
          else
            echo "|  Redis:         redis:6379 (Docker internal network)        |"
          fi
          echo "|  Snapshots:     every 5 min  saved at shutdown             |"
          echo "|                                                             |"
          echo "|  Monitor:       https://github.com/${{ github.repository }}/actions|"
          echo "|  Badge:         https://github.com/${{ github.repository }}/actions/workflows/supabase-host.yml/badge.svg |"
          echo "|                                                             |"
          echo "|  Runs until:    $(date -d @$END_TIME '+%H:%M UTC')             |"
          echo "|  Auto-restart:  watchman + 6h sched                         |"
          echo "|  Remaining:     $(( DURATION / 60 )) min                                 |"
          echo "|                                                             |"
          echo "+=============================================================+"
          echo ""

          # Write clickable links directly to GitHub Actions Run Summary
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "###  Supabase & Redis are LIVE!"
              echo ""
              echo "| Service | Link / Endpoint |"
              echo "|---|---|"
              echo "|  **Studio Dashboard** | [https://$DOMAIN](https://$DOMAIN) |"
              echo "|  **Redis Web Dashboard** | [https://$REDIS_SUBDOMAIN](https://$REDIS_SUBDOMAIN) *(route to \`localhost:8081\` in CF Zero Trust)* |"
              if [ -n "${REDIS_TCP_PORT:-}" ]; then
                echo "|  **Redis Direct TCP** | \`redis://default:${REDIS_PASSWORD:-Basudevkr123}@$REDIS_SUBDOMAIN:${REDIS_TCP_PORT}\` |"
              fi
              echo "|  **Redis Cache API** | [https://$DOMAIN/functions/v1/cache](https://$DOMAIN/functions/v1/cache) |"
              echo "|  **REST API** | [https://$DOMAIN/rest/v1/](https://$DOMAIN/rest/v1/) |"
              echo "|  **Auth API** | [https://$DOMAIN/auth/v1/](https://$DOMAIN/auth/v1/) |"
              echo ""
              if [ -n "${REDIS_TCP_PORT:-}" ]; then
                echo "####  Connect to Redis from Anywhere:"
                echo "- **Permanent URI**: \`redis://default:${REDIS_PASSWORD:-Basudevkr123}@$REDIS_SUBDOMAIN:${REDIS_TCP_PORT}\` *(requires CNAME \`$REDIS_SUBDOMAIN\`  \`bore.pub\` in DNS)*"
                echo "- **Direct Relay URI**: \`redis://default:${REDIS_PASSWORD:-Basudevkr123}@${REDIS_TCP_HOST:-bore.pub}:${REDIS_TCP_PORT}\`"
                echo "- **CLI Command**: \`redis-cli -h ${REDIS_TCP_HOST:-bore.pub} -p ${REDIS_TCP_PORT} -a ${REDIS_PASSWORD:-Basudevkr123}\`"
                echo ""
              fi
              echo "- **Redis Web GUI**: [https://$REDIS_SUBDOMAIN](https://$REDIS_SUBDOMAIN) (credentials: \`redis\` / \`redis\`)"
              echo "- **Redis Internal**: \`redis:6379\` (Docker network)"
              echo "- **Scheduled run ends**: $(date -d @$END_TIME '+%H:%M UTC')"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${REDIS_TCP_PORT:-}" ]; then
            echo "::notice title= Supabase & Redis Live::Studio: https://$DOMAIN | Redis Web: https://$REDIS_SUBDOMAIN | TCP: ${REDIS_TCP_HOST:-bore.pub}:${REDIS_TCP_PORT}"
          else
            echo "::notice title= Supabase is Live::Studio: https://$DOMAIN | Redis: https://$DOMAIN/functions/v1/cache"
          fi

          #  Keepalive loop + health checks + 5-min on-disk snapshots 
          # (run_id/run_attempt are used by the final cache-save step's key)
          SLOT=0
          SNAPSHOTS=0
          TICK=0
          FAILS=0
          NEXT_SNAP=$(date +%s)
          while [ $(date +%s) -lt $END_TIME ]; do
            NOW=$(date +%s)

            # Full-state snapshot every 5 minutes (DB dump + key + functions + snippets),
            # kept on disk so the end-of-run cache save (if: always()) always has the
            # freshest archive. GitHub no longer allows run-step cache writes.
            if [ "$NOW" -ge "$NEXT_SNAP" ]; then
              echo ""
              echo " [$(date '+%H:%M:%S')] Snapshot #$SLOT (every-5-min on-disk)..."
              bash utils/snapshot-state.sh || true
              if [ -s ./supabase-state.tar.gz ]; then
                SNAPSHOTS=$((SNAPSHOTS + 1))
              else
                echo "    archive not created  will retry next tick"
              fi
              NEXT_SNAP=$((NOW + 300))
              SLOT=$((SLOT + 1))
              # Prune old cache entries once an hour (keeps the 10GB cap in check)
              if [ $(( SLOT % 12 )) -eq 0 ]; then
                bash utils/prune-caches.sh >/dev/null 2>&1 || true
              fi
            fi

            # Health check + heartbeat every 60s (tick = 10s)
            # Probes BOTH local Kong (localhost:8000) AND the public tunnel
            # domain (if configured)  so a dead cloudflared or dead Kong both
            # count. curl exits 0 on any HTTP response (incl. Kong's 401), so
            # these are liveness checks: they fail only when the endpoint is
            # unreachable.
            # NOTE: after 3 CONSECUTIVE failed health checks (~3 min) the step
            # exits non-zero. The run then concludes 'failure', which the
            # workflow-watchman worker sees within ~1-2 min and restarts  so a
            # mid-session crash (Kong/Postgres/tunnel death) can never silently
            # idle for the remaining ~5h. The if: always() steps below still run
            # (final backup + cache save), so the freshest state is preserved.
            if [ $(( TICK % 6 )) -eq 0 ]; then
              HEALTH_OK=1
              if ! curl -s -o /dev/null --max-time 15 http://localhost:8000; then
                HEALTH_OK=0
                echo "   localhost:8000 (Kong) unreachable"
              fi
              if [ -n "$TUNNEL_DOMAIN" ] && ! curl -s -o /dev/null --max-time 15 "https://$DOMAIN"; then
                HEALTH_OK=0
                echo "   tunnel https://$DOMAIN unreachable"
              fi
              if [ "$HEALTH_OK" -eq 1 ]; then
                FAILS=0
                REMAINING=$(( (END_TIME - NOW) / 60 ))
                echo "$(date '+%H:%M:%S') -- Healthy | ${REMAINING}m remaining | snapshots: $SNAPSHOTS"
                if [ -n "${BORE_PID:-}" ] && ! kill -0 "$BORE_PID" 2>/dev/null; then
                  echo "   bore process exited  restarting Redis tunnel..."
                  nohup bore local 6379 --to bore.pub > /tmp/bore.log 2>&1 &
                  BORE_PID=$!
                fi
              else
                FAILS=$((FAILS + 1))
                echo "$(date '+%H:%M:%S') -- Health check failed ($FAILS/3 consecutive)"
                docker compose ps --no-color 2>/dev/null | head -10 || true
                if [ "$FAILS" -ge 3 ]; then
                  echo ""
                  echo " HEALTH CHECK FAILED 3x IN A ROW  Supabase/tunnel is DOWN. Exiting to trigger watchman restart (cache save still runs)."
                  exit 1
                fi
              fi
            fi
            sleep 10
            TICK=$((TICK + 1))

            # ------------------------------------------------------------------
            # Graceful operator-triggered shutdown: if the file `.session-stop`
            # exists in the repo root, exit the keepalive loop (~30s latency).
            # The run then completes NORMALLY (not cancelled), so the if-always
            # final-backup and end-of-run cache-save steps still run and the
            # freshest state archive is persisted to the GitHub Actions cache
            # for the next session.
            # Remove the marker (git rm) once the desired session has saved.
            # ------------------------------------------------------------------
            if [ $(( TICK % 3 )) -eq 0 ] && curl -sf --max-time 10 -o /dev/null \
                 "https://raw.githubusercontent.com/${{ github.repository }}/master/.session-stop"; then
              echo "  End-session marker (.session-stop) detected  ending session gracefully; state will be saved to cache"
              break
            fi

            if [ $(( TICK % 6 )) -eq 0 ]; then printf "."; fi
          done
          echo ""
          echo "Session complete  $SNAPSHOTS snapshots written to disk (saved to cache at shutdown). Starting graceful shutdown..."

      #  Final state backup before shutdown 
      # Same script the keepalive loop uses every 5 min. Runs even if an
      # earlier step failed (if: always()), so the cache always receives the
      # freshest possible archive at shutdown. Crash-safe: the previous
      # archive is never deleted before the new one is fully written.
      - name:  Final state backup before shutdown
        if: "!cancelled()"
        run: |
          cd ${{ env.SUPABASE_DIR }}
          bash utils/snapshot-state.sh || true
          # Safeguard: if archive is suspiciously small (<500KB), remove it so an aborted run never overwrites a real database in cache
          # (stat the archive relative to this step's cwd  supabase/  BACKUP_FILE is workspace-root-relative)
          ARCHIVE_SIZE=$(stat -c%s ./supabase-state.tar.gz 2>/dev/null || echo 0)
          if [ "$ARCHIVE_SIZE" -lt 500000 ]; then
            echo "::warning::state archive is suspiciously small (${ARCHIVE_SIZE}B) — refusing to overwrite the production cache entry with it (the previous good archive stays authoritative; check the off-site Cloudflare mirror too)"
            echo " Archive is suspiciously small (${ARCHIVE_SIZE}B)  refusing to overwrite production cache!"
            rm -f ./supabase-state.tar.gz
          fi

      #  Stop services 
      - name:  Stop Supabase services
        if: always()
        run: |
          cd ${{ env.SUPABASE_DIR }}
          docker compose down 2>/dev/null || true
          echo "All services stopped"

      #  Save full state archive to cache 
      # The keepalive loop writes on-disk snapshots every 5 minutes; this step
      # persists the freshest one to the Actions cache at the end of the run.
      # Only runs if NOT cancelled and a valid state archive exists on disk.
      - name:  Save final state to GitHub Actions cache
        if: "!cancelled() && hashFiles('supabase/supabase-state.tar.gz') != ''"
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BACKUP_FILE }}
          key: supabase-db-live-${{ github.run_id }}-${{ github.run_attempt }}-final

      #  Summary 
      - name:  Log session summary
        if: always()
        env:
          TUNNEL_DOMAIN: ${{ vars.CF_TUNNEL_DOMAIN || secrets.CF_TUNNEL_DOMAIN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          DOMAIN="${TUNNEL_DOMAIN:-localhost:8000}"
          echo ""
          echo "+=============================================================+"
          echo "|  SESSION COMPLETE                                           |"
          echo "+=============================================================+"
          if [ -f ${{ env.BACKUP_FILE }} ]; then
            SIZE=$(du -h ${{ env.BACKUP_FILE }} | cut -f1)
            echo "|  Database backed up ($SIZE)                                |"
          fi
          echo "|  Next run: watchman auto-restart (~5 min)                  |"
          if [ -n "$TUNNEL_DOMAIN" ]; then
            echo "|  https://$DOMAIN                                              |"
            echo "|  Badge: https://github.com/${{ github.repository }}/actions/workflows/supabase-host.yml/badge.svg |"
          fi
          echo "|  Monitor: https://github.com/${{ github.repository }}/actions    |"
          echo "+=============================================================+"
          echo ""
          # Cache usage vs GitHub's 10GB per-repo limit (best-effort report)
          USAGE=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/caches" 2>/dev/null | \
            python3 -c 'import sys,json; d=json.load(sys.stdin); print(f"{d.get(\"total_size_bytes\",0)/1024/1024/1024:.2f} GB across {d.get(\"total_count\",0)} cache entries (limit 10 GB)")' 2>/dev/null || echo "unknown")
          echo "    GitHub cache usage: $USAGE"
