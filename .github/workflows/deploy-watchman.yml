# One-off: deploy the workflow-watchman Worker after config change
name: Deploy workflow-watchman

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Supabase-Actions
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Deploy the Worker
        working-directory: worker/workflow-watchman
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_TOKEN }}
        run: npx --yes wrangler@3 deploy